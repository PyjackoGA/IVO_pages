<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espace client — IVO Capital Partners</title>
<link rel="stylesheet" href="../lib/ivo-theme.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Libre+Franklin:wght@600;700;800&display=swap">
<style>
.wrap{max-width:820px;}
.card{max-width:420px;margin:60px auto;}
.card.wide{max-width:100%;}
.login-field{margin-bottom:16px;}
.topbar-user{margin-left:auto;display:flex;align-items:center;gap:10px;position:relative;z-index:1;}
.topbar-user span{color:rgba(255,255,255,.85);font-size:12.5px;}
.topbar-user button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;font-weight:600;padding:6px 12px;border-radius:5px;cursor:pointer;}
.topbar-user button:hover{background:rgba(255,255,255,.22);}
.err-box{background:var(--danger-soft);border:1px solid var(--danger);color:var(--danger);border-radius:6px;padding:10px 12px;font-size:12.5px;margin-top:12px;}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted);font-size:13.5px;}

.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.badge-complete{background:var(--success-soft);color:var(--success);border:1px solid var(--success);}
.badge-recu{background:var(--blue-soft);color:var(--heading);border:1px solid var(--blue-soft-border);}
.badge-encours{background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);}
.badge-danger{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger);}

.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:22px;}
@media (max-width:640px){.statgrid{grid-template-columns:1fr;}}
.stattile2{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;box-shadow:var(--shadow);}
.stattile2 .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);font-weight:700;margin-bottom:10px;}
.stattile2 .v{font-family:'Libre Franklin',sans-serif;font-weight:800;font-size:20px;color:var(--heading);}

.section-title{font-size:15px;font-weight:800;color:var(--heading);margin:30px 0 4px;padding-top:22px;border-top:1px solid var(--border);}
.section-title:first-child{margin-top:0;padding-top:0;border-top:none;}
.section-sub{font-size:12.5px;color:var(--text-muted);margin:0 0 16px;}

/* ⚠ ALIGNEMENT DES 3 COLONNES (nom / statut / bouton) : le premier enfant de
   .subitem (bloc nom+fichier) prend TOUT l'espace restant ("flex:1"), ce qui
   pousse systématiquement le badge et le bouton au même endroit sur chaque
   ligne, quelle que soit la longueur du nom ou du texte du badge — sans ça
   (ancien "justify-content:space-between"), le badge se décalait ligne par
   ligne selon la largeur du texte qui le précède. */
.subitem{border:1px solid var(--border);border-radius:8px;padding:14px 16px;display:flex;align-items:center;gap:12px;background:var(--surface);}
.subitem.dashed{border-style:dashed;}
.subitem>div:first-child{flex:1 1 auto;min-width:0;}
.subitem .badge{flex-shrink:0;min-width:180px;text-align:center;}
.subitem .btn{flex-shrink:0;min-width:130px;text-align:center;}
.sublist{display:flex;flex-direction:column;gap:10px;}
.btn{padding:9px 16px;border-radius:6px;font-size:12.5px;font-weight:700;cursor:pointer;border:none;font-family:inherit;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-ghost{background:none;color:var(--text-muted);border:1.5px solid var(--border);}
</style>
</head>
<body>

<div id="topbar"></div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<!-- ⚠ LIÉ À client/config.js : ce fichier espace-client/config.js est une
     COPIE SÉPARÉE du même contenu (même URL/clé Supabase). Si vous changez
     les identifiants Supabase, il faut les changer aux DEUX endroits. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
"use strict";

/* --- TYPES DE DOCUMENTS PERSONNELS / PIÈCES JUSTIFICATIVES CLIENT
   ⚠ TRIPLE LIEN — ces clés doivent rester identiques à :
     1. le même tableau DOC_TYPES dans lib/conseiller-app.js (partie conseiller) ;
     2. la contrainte SQL "doc_type in (...)" de client_documents
        (supabase/schema-v2-portail-client.sql, section 8).
   Ajouter un type ici sans le faire aux 2 autres endroits fait échouer
   l'envoi du document (rejeté par la base) ou casse l'affichage du libellé
   côté conseiller.

   ⚠ Cette liste contient TOUS les documents possibles, mais un client donné
   n'en voit qu'une partie — voir requestedDocTypes() juste en dessous, qui
   filtre selon appState.account.requested_docs (choisi par le conseiller,
   encart "Documents demandés" du Dossier KYC). --- */
var DOC_TYPES = [
  {key:"cni", label:"Carte d'identité"},
  {key:"justificatif_domicile", label:"Justificatif de domicile"},
  {key:"rib", label:"RIB"},
  {key:"preuve_origine_fonds", label:"Preuve d'origine des fonds"},
  {key:"kyc", label:"KYC"},
  {key:"numero_fiscal", label:"Numéro fiscal"},
  {key:"diligence_lcbft", label:"Diligence LCB-FT"},
  {key:"esg_anciens_clients", label:"Questionnaire ESG (anciens clients)"},
  {key:"statuts", label:"Statuts"},
  {key:"kbis_rcs", label:"K-Bis / RCS"},
  {key:"rbe", label:"RBE (registre des bénéficiaires effectifs)"},
  {key:"id_jdd_beneficiaires", label:"ID + justificatif de domicile des bénéficiaires effectifs"},
  {key:"bilan", label:"Bilan"},
  {key:"diligence_lcbft_beneficiaire", label:"Diligence LCB-FT (bénéficiaire effectif)"},
  {key:"justificatif_revenus", label:"Justificatif de revenus"},
  {key:"autre", label:"Autre document"},
];

/* Sous-ensemble de DOC_TYPES réellement demandé à CE client (appState.account
   .requested_docs, la ligne "profiles" du compte) — c'est CETTE fonction
   qu'il faut utiliser pour décider quoi afficher, jamais DOC_TYPES
   directement (qui liste TOUS les documents possibles, tous clients
   confondus). ⚠ Indépendant de tout dossier KYC — voir
   supabase/schema-v2-portail-client.sql section 9. */
function requestedDocTypes(){
  var keys = (appState.account && appState.account.requested_docs) || [];
  return DOC_TYPES.filter(function(t){ return keys.indexOf(t.key) > -1; });
}

/* Nom d'affichage du compte selon son type (mêmes règles que
   accountDisplayName() de lib/conseiller-app.js). */
function accountDisplayName(p){
  if(!p) return "";
  return p.person_type==="morale" ? (p.denomination||"") : ((p.prenom||"")+" "+(p.nom||"")).trim();
}

function esc(s){ return (s||"").toString().replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function fmtDateTime(iso){ try{ return new Date(iso).toLocaleString('fr-FR'); }catch(e){ return iso; } }

var supa = null;
function getClient(){
  if(supa) return supa;
  var cfg = window.IVO_CONFIG;
  if(!cfg || !cfg.SUPABASE_URL || cfg.SUPABASE_URL.indexOf("your-project-ref")>-1){
    throw new Error("config.js n'est pas encore renseigné avec vos identifiants Supabase.");
  }
  supa = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  return supa;
}

var appState = {
  view: "loading", // loading | login | noaccount | dashboard
  session: null,
  account: null, // ligne "profiles" du compte connecté — indépendant de tout dossier KYC
  documents: [],
  reports: [],
  sharedFiles: [], // fichiers que le conseiller a rendus visibles (table client_files, bucket "library")
  sharedFolders: [], // leurs dossiers (table client_folders), pour afficher le classement
  tab: "dashboard", // dashboard | documents | bilans
  loginError: "",
  loadError: "",
  uploadError: "",
};

function showToast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 2400);
}

function render(){
  document.getElementById("topbar").innerHTML = renderTopbar();
  var app = document.getElementById("app");
  if(appState.view==="loading") app.innerHTML = '<div class="card"><p class="step-intro" style="margin:0">Chargement…</p></div>';
  else if(appState.view==="login") app.innerHTML = renderLogin();
  else if(appState.view==="noaccount") app.innerHTML = renderNoAccount();
  else if(appState.view==="dashboard") app.innerHTML = renderDashboard();
  bindEvents();
}

/* ⚠ LIÉ À lib/ivo-theme.css (taille du bandeau/logo réglée là-bas, pas ici)
   ET au fichier assets/logo-ivo-white.png, référencé aussi depuis index.html
   racine, client/index.html et lib/conseiller-app.js — 4 endroits en tout. */
function renderTopbar(){
  var userBit = appState.session ? (
    '<div class="topbar-user"><span>'+esc(appState.session.user.email)+'</span><button data-action="logout">Déconnexion</button></div>'
  ) : "";
  return '<div class="topbar-inner">' +
    '<div class="brand-badge"><img src="../assets/logo-ivo-white.png" alt="IVO Capital Partners"></div>' +
    '<div class="brand-context"><div class="brand-sub">Espace client</div></div>' +
    userBit +
  '</div>';
}

function renderLogin(){
  return '<div class="card">' +
    '<div class="eyebrow">Accès réservé</div>' +
    '<h1 class="step-title">Espace client</h1>' +
    '<p class="step-intro">Connectez-vous avec les identifiants transmis par votre conseiller IVO Capital Partners.</p>' +
    '<div class="login-field"><label class="flabel">Email</label><input type="email" id="loginEmail" autocomplete="username"></div>' +
    '<div class="login-field"><label class="flabel">Mot de passe</label><input type="password" id="loginPassword" autocomplete="current-password"></div>' +
    '<button class="btn btn-primary" style="width:100%" data-action="login">Se connecter</button>' +
    (appState.loginError ? '<div class="err-box">'+esc(appState.loginError)+'</div>' : '') +
  '</div>';
}

function renderNoAccount(){
  return '<div class="card">' +
    '<div class="eyebrow">Espace client</div>' +
    '<h1 class="step-title">Compte introuvable</h1>' +
    '<p class="step-intro">Votre connexion a réussi, mais aucun compte client ne correspond. Contactez votre conseiller IVO Capital Partners.</p>' +
  '</div>';
}

function docBadge(status){
  if(!status) return '<span class="badge badge-encours">À fournir</span>';
  if(status==="valide") return '<span class="badge badge-complete">Validé</span>';
  if(status==="refuse") return '<span class="badge badge-danger">Refusé — à retransmettre</span>';
  return '<span class="badge badge-recu">En attente de validation</span>';
}

function latestDocByType(type){
  var matching = appState.documents.filter(function(d){ return d.doc_type===type; });
  if(!matching.length) return null;
  matching.sort(function(a,b){ return new Date(b.uploaded_at) - new Date(a.uploaded_at); });
  return matching[0];
}

function renderDashboard(){
  var acc = appState.account;
  var myDocTypes = requestedDocTypes();
  var validCount = myDocTypes.filter(function(t){ var d = latestDocByType(t.key); return d && d.status==="valide"; }).length;
  var lastReport = appState.reports.length ? appState.reports[0] : null;

  /* ⚠ Le bouton "Actualiser" est nécessaire car il n'y a pas de mise à jour
     en temps réel : si votre conseiller valide un document ou envoie un
     bilan pendant que cette page est déjà ouverte, il faut ce bouton (ou un
     rechargement de la page) pour voir le changement — voir loadEverything(). */
  var html = '<div class="tabrow" style="display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;border-bottom:1px solid var(--border);margin-bottom:20px">' +
    tabBtn("dashboard","Tableau de bord") + tabBtn("documents","Mes documents") + tabBtn("bilans","Mes bilans") +
    '<button type="button" class="btn btn-ghost" style="margin-left:auto" data-action="refresh">↻ Actualiser</button>' +
  '</div>';

  if(appState.tab==="dashboard"){
    html += '<div class="eyebrow">Bonjour</div>';
    html += '<h1 class="step-title">'+esc(accountDisplayName(acc)||"")+'</h1>';
    html += '<p class="step-intro">Voici un aperçu de votre espace chez IVO Capital Partners.</p>';
    html += '<div class="statgrid">' +
      '<div class="stattile2"><div class="l">Documents fournis</div><div class="v">'+validCount+' <small style="font-size:12px;color:var(--text-muted)">/ '+myDocTypes.length+'</small></div></div>' +
      '<div class="stattile2"><div class="l">Dernier bilan reçu</div><div class="v" style="font-size:15px">'+(lastReport?esc(fmtDateTime(lastReport.sent_at)):'—')+'</div></div>' +
    '</div>';
    if(myDocTypes.length && validCount < myDocTypes.length){
      html += '<div class="info"><span class="ic">ℹ️</span><div>Il vous reste des documents à transmettre pour finaliser votre dossier. <a href="#" data-action="goDocuments" style="color:var(--heading);font-weight:700">Voir mes documents</a></div></div>';
    }
  } else if(appState.tab==="documents"){
    html += '<h1 class="step-title" style="margin-bottom:4px">Mes documents</h1>';
    html += '<p class="section-sub">Transmettez vos justificatifs, votre conseiller les valide directement.</p>';
    if(appState.uploadError) html += '<div class="err-box">'+esc(appState.uploadError)+'</div>';
    if(!myDocTypes.length){
      html += '<div class="empty-state">Aucun document à transmettre pour l\'instant — votre conseiller vous préviendra si besoin.</div>';
    }
    html += '<div class="sublist">';
    myDocTypes.forEach(function(t){
      var d = latestDocByType(t.key);
      html += '<div class="subitem'+(!d?' dashed':'')+'">' +
        '<div><div class="subitem-name" style="font-weight:700;font-size:14px">'+esc(t.label)+'</div>' +
        '<div class="subitem-meta" style="font-size:12px;color:var(--text-muted);margin-top:2px">'+(d?esc(d.file_name||""):'Aucun fichier transmis')+'</div></div>' +
        docBadge(d && d.status) +
        '<label class="btn '+(d&&d.status==="valide"?"btn-ghost":"btn-primary")+'" style="cursor:pointer;flex-shrink:0">'+(d?'Remplacer':'Téléverser')+
          '<input type="file" data-action="uploadDoc" data-doctype="'+t.key+'" style="display:none">' +
        '</label>' +
      '</div>';
    });
    html += '</div>';

    /* --- DOCUMENTS PARTAGÉS PAR LE CONSEILLER (lecture seule) --- */
    if(appState.sharedFiles.length){
      html += '<h2 style="font-size:15px;margin:28px 0 4px;color:var(--heading)">Documents partagés par votre conseiller</h2>';
      html += '<p class="section-sub">Ces documents vous ont été transmis par IVO Capital Partners.</p>';
      // regroupement par dossier (chemin complet), la racine d'abord
      var folderById = {};
      appState.sharedFolders.forEach(function(d){ folderById[d.id] = d; });
      function folderPath(id){
        var names = [], c = id, g = 0;
        while(c && folderById[c] && g++ < 60){ names.unshift(folderById[c].name); c = folderById[c].parent_id; }
        return names.join(" / ");
      }
      var groups = {};
      appState.sharedFiles.forEach(function(f){
        var p = folderPath(f.folder_id);
        (groups[p] = groups[p] || []).push(f);
      });
      Object.keys(groups).sort(function(a,b){ return a.localeCompare(b, "fr", {numeric:true}); }).forEach(function(path){
        if(path) html += '<div class="section-sub" style="margin:16px 0 6px;font-weight:700">📁 '+esc(path)+'</div>';
        html += '<div class="sublist">';
        groups[path].forEach(function(f){
          html += '<div class="subitem">' +
            '<div><div class="subitem-name" style="font-weight:700;font-size:14px">'+esc((f.file_name||"").split("/").pop())+'</div>' +
            '<div class="subitem-meta" style="font-size:12px;color:var(--text-muted);margin-top:2px">Transmis le '+fmtDateTime(f.uploaded_at)+'</div></div>' +
            '<button class="btn btn-ghost" data-action="viewShared" data-id="'+esc(f.id)+'">Voir</button>' +
            '<button class="btn btn-primary" data-action="downloadShared" data-id="'+esc(f.id)+'">Télécharger</button>' +
          '</div>';
        });
        html += '</div>';
      });
    }
  } else if(appState.tab==="bilans"){
    html += '<h1 class="step-title" style="margin-bottom:4px">Mes bilans</h1>';
    html += '<p class="section-sub">Les comptes rendus et bilans transmis par votre conseiller.</p>';
    if(!appState.reports.length){
      html += '<div class="empty-state">Aucun bilan reçu pour le moment.</div>';
    } else {
      html += '<div class="sublist">';
      appState.reports.forEach(function(r){
        html += '<div class="subitem">' +
          '<div><div class="subitem-name" style="font-weight:700;font-size:14px">'+esc(r.title)+'</div>' +
          '<div class="subitem-meta" style="font-size:12px;color:var(--text-muted);margin-top:2px">Transmis le '+fmtDateTime(r.sent_at)+'</div></div>' +
          '<button class="btn btn-primary" data-action="downloadReport" data-id="'+esc(r.id)+'">Télécharger</button>' +
        '</div>';
      });
      html += '</div>';
    }
  }

  return '<div class="card wide">' + html + '</div>';
}

function tabBtn(key, label){
  var on = appState.tab===key;
  return '<button data-action="tab" data-tab="'+key+'" style="cursor:pointer;border:none;background:none;font-family:inherit;padding:10px 2px;font-size:13.5px;font-weight:700;border-bottom:2.5px solid '+(on?'var(--accent)':'transparent')+';color:'+(on?'var(--heading)':'var(--text-muted)')+'">'+label+'</button>';
}

/* ---------- data loading ---------- */
async function init(){
  try{
    var client = getClient();
    var { data } = await client.auth.getSession();
    appState.session = data.session;
    if(data.session){
      await loadEverything();
    } else {
      appState.view = "login";
    }
    render();
    client.auth.onAuthStateChange(function(event, session){
      appState.session = session;
      if(!session){ appState.view = "login"; render(); }
    });
  }catch(err){
    appState.view = "login";
    appState.loginError = err.message;
    render();
  }
}

/* ⚠ Le compte est sa ligne "profiles" (role='client'), indépendante de tout
   dossier KYC — voir supabase/schema-v2-portail-client.sql section 9 et
   lib/conseiller-app.js (createNewClientFromScratch()) côté conseiller. */
async function loadEverything(){
  var client = getClient();
  var uid = appState.session.user.id;
  var { data: profile, error } = await client.from("profiles").select("*").eq("id", uid).maybeSingle();
  if(error){ appState.loadError = error.message; appState.view = "dashboard"; return; }
  if(!profile){ appState.view = "noaccount"; return; }
  appState.account = profile;
  appState.view = "dashboard";

  var [{ data: docs }, { data: reports }, { data: shared }, { data: sharedFolders }] = await Promise.all([
    client.from("client_documents").select("*").eq("client_id", uid).order("uploaded_at",{ascending:false}),
    client.from("client_reports").select("*").eq("client_id", uid).order("sent_at",{ascending:false}),
    // ⚠ la RLS (client_files, supabase/schema-v2-portail-client.sql section 10)
    // ne renvoie QUE les fichiers attribués à ce compte ET marqués "client" —
    // les fichiers internes du conseiller ne sont jamais visibles ici.
    client.from("client_files").select("*").eq("client_id", uid).eq("visibility","client").order("uploaded_at",{ascending:false}),
    client.from("client_folders").select("*").eq("client_id", uid).eq("visibility","client"),
  ]);
  appState.documents = docs || [];
  appState.reports = reports || [];
  appState.sharedFiles = shared || [];
  appState.sharedFolders = sharedFolders || [];
}

function bindEvents(){
  var app = document.getElementById("app");
  var topbar = document.getElementById("topbar");

  [app, topbar].forEach(function(root){
    root.querySelectorAll("[data-action]").forEach(function(el){
      var evt = (el.tagName==="INPUT" && el.type==="file") ? "change" : "click";
      el.addEventListener(evt, function(e){
        var action = el.getAttribute("data-action");
        if(action==="login"){ e.preventDefault(); doLogin(); return; }
        if(action==="logout"){ getClient().auth.signOut(); appState.view="login"; render(); return; }
        if(action==="tab"){ appState.tab = el.getAttribute("data-tab"); render(); return; }
        if(action==="refresh"){ loadEverything().then(render); return; }
        if(action==="goDocuments"){ e.preventDefault(); appState.tab = "documents"; render(); return; }
        if(action==="uploadDoc"){
          if(el.files && el.files[0]) uploadDocument(el.getAttribute("data-doctype"), el.files[0]);
          return;
        }
        if(action==="downloadReport"){ downloadReport(el.getAttribute("data-id")); return; }
        if(action==="viewShared"){ openShared(el.getAttribute("data-id"), false); return; }
        if(action==="downloadShared"){ openShared(el.getAttribute("data-id"), true); return; }
      });
    });
  });
}

async function doLogin(){
  appState.loginError = "";
  var email = document.getElementById("loginEmail").value.trim();
  var password = document.getElementById("loginPassword").value;
  if(!email || !password){ appState.loginError = "Email et mot de passe requis."; render(); return; }
  try{
    var client = getClient();
    var { data, error } = await client.auth.signInWithPassword({ email: email, password: password });
    if(error) throw new Error(error.message);
    appState.session = data.session;
    await loadEverything();
    render();
  }catch(err){
    appState.loginError = err.message;
    render();
  }
}

async function uploadDocument(docType, file){
  appState.uploadError = "";
  try{
    var client = getClient();
    var acc = appState.account;
    // ⚠ CONVENTION DE CHEMIN LIÉE AUX POLICIES SQL (supabase/schema-v2-portail-client.sql,
    // section 9, policies "client-documents ..." qui lisent
    // (storage.foldername(name))[1]) ET à la même convention utilisée côté
    // conseiller dans lib/conseiller-app.js (fonction advisorUploadDocument)
    // — ne pas changer la forme "<id du COMPTE>/..." sans mettre à jour les
    // policies SQL.
    var path = acc.id + "/" + docType + "-" + Date.now() + "-" + file.name;
    var upload = await client.storage.from("client-documents").upload(path, file, { upsert:false });
    if(upload.error) throw new Error(upload.error.message);
    var insert = await client.from("client_documents").insert({
      client_id: acc.id,
      doc_type: docType,
      file_name: file.name,
      storage_path: path,
      status: "a_valider",
    });
    if(insert.error) throw new Error(insert.error.message);
    var { data: docs } = await client.from("client_documents").select("*").eq("client_id", acc.id).order("uploaded_at",{ascending:false});
    appState.documents = docs || [];
    showToast("Document transmis ✓");
    render();
  }catch(err){
    appState.uploadError = err.message;
    render();
  }
}

/* ⚠ Le bucket "library" est répété dans lib/conseiller-app.js — voir
   supabase/schema-v2-portail-client.sql section 10. */
async function openShared(id, download){
  var f = appState.sharedFiles.filter(function(x){ return x.id===id; })[0];
  if(!f) return;
  try{
    var client = getClient();
    var base = (f.file_name||"fichier").split("/").pop();
    var res = await client.storage.from("library").createSignedUrl(f.storage_path, 120, download ? { download: base } : undefined);
    if(res.error) throw new Error(res.error.message);
    window.open(res.data.signedUrl, "_blank");
  }catch(err){
    showToast("Impossible d'ouvrir le fichier : " + err.message);
  }
}

async function downloadReport(id){
  var report = appState.reports.filter(function(r){ return r.id===id; })[0];
  if(!report) return;
  try{
    var client = getClient();
    var { data, error } = await client.storage.from("client-reports").createSignedUrl(report.storage_path, 120);
    if(error) throw new Error(error.message);
    window.open(data.signedUrl, "_blank");
  }catch(err){
    showToast("Impossible d'ouvrir le fichier : " + err.message);
  }
}

init();
})();
