<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interface conseiller — IVO Capital Partners</title>
<link rel="stylesheet" href="../lib/ivo-theme.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Libre+Franklin:wght@600;700;800&display=swap">
<style>
/* ==========================================================================
   RÈGLES VISUELLES DE L'INTERFACE CONSEILLER (à respecter en ajoutant du code)
   1. Bordure en POINTILLÉS = on peut vraiment y glisser un fichier (zone de
      dépôt reliée à bindDnd() dans lib/conseiller-app.js). Jamais ailleurs.
   2. Curseur "main" + chevron › = ligne cliquable (classe .subitem.clickable).
      Une ligne d'information simple n'a ni l'un ni l'autre.
   3. Un seul trait de séparation à la fois : le trait sous les onglets
      (.tabrow) n'est jamais suivi d'un titre lui-même surmonté d'un trait
      (utiliser .block-title, sans trait, au niveau des pages).
   ========================================================================== */
.wrap{max-width:980px;}
.card{max-width:420px;margin:60px auto;}
/* ⚠ une carte large ne porte PAS la marge de 60px de l'écran de connexion :
   c'est elle qui créait les grands vides entre les blocs du tableau de bord. */
.card.wide{max-width:100%;margin:0 0 16px;}
.login-field{margin-bottom:16px;}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.block-title{font-size:15px;font-weight:800;color:var(--heading);margin:28px 0 10px;}
.searchbox{margin-bottom:12px;}
.busyline{font-size:12.5px;color:var(--text-muted);min-height:18px;margin:6px 0 0;}
.btn{padding:9px 16px;font-size:13px;}
.btn-large{padding:14px 28px;font-size:15px;}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-danger:hover{background:var(--danger);color:#fff;}
.topbar-user{margin-left:auto;display:flex;align-items:center;gap:10px;position:relative;z-index:1;}
.topbar-user span{color:rgba(255,255,255,.85);font-size:12.5px;}
.topbar-user button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;font-weight:600;padding:6px 12px;border-radius:5px;cursor:pointer;}
.topbar-user button:hover{background:rgba(255,255,255,.22);}
/* petit écran : l'email déborderait du bandeau, on ne garde que "Déconnexion" */
@media (max-width:560px){.topbar-user span{display:none;}}

.subrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.sublist{display:flex;flex-direction:column;gap:10px;}
/* ⚠ ALIGNEMENT : le premier enfant de .subitem (bloc nom + détails) prend tout
   l'espace restant ; badges et boutons se rangent donc toujours à droite, au
   même endroit sur chaque ligne (plus de badge "flottant" au milieu). */
.subitem{border:1px solid var(--border);border-radius:8px;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);transition:border-color .12s ease;}
.subitem>div:first-child{flex:1 1 240px;min-width:0;}
.subitem.clickable{cursor:pointer;}
.subitem.clickable:hover{border-color:var(--navy);}
.subitem .chev{color:var(--text-muted);font-size:20px;line-height:1;flex-shrink:0;}
.subitem.clickable:hover .chev{color:var(--heading);}
.subitem-name{font-weight:700;font-size:14px;overflow-wrap:anywhere;}
.subitem-meta{font-size:12px;color:var(--text-muted);margin-top:2px;overflow-wrap:anywhere;}
.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.badge-recu{background:var(--blue-soft);color:var(--heading);border:1px solid var(--blue-soft-border);}
.badge-complete{background:var(--success-soft);color:var(--success);border:1px solid var(--success);}
.badge-encours{background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);}
.badge-danger{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger);}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted);font-size:13.5px;}

/* --- CARTES "À TRAITER" DU TABLEAU DE BORD (⚠ LIÉ À renderDashboard() et
   updateCountersDom() dans lib/conseiller-app.js, qui génèrent .statgrid4 /
   .statcard). Ce sont des BOUTONS : un clic ouvre l'onglet concerné. --- */
.statgrid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:6px;}
@media (max-width:820px){.statgrid4{grid-template-columns:repeat(2,minmax(0,1fr));}}
.statcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);text-align:left;font-family:inherit;cursor:pointer;transition:border-color .12s ease;}
.statcard:hover{border-color:var(--navy);}
.statcard.warn{border-color:var(--danger);background:var(--danger-soft);}
.sc-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);font-weight:700;margin-bottom:8px;}
.statcard.warn .sc-label{color:var(--danger);}
.sc-value{font-family:'Libre Franklin',sans-serif;font-weight:800;font-size:26px;color:var(--heading);}
.statcard.warn .sc-value{color:var(--danger);}

.dropzone{border:1.5px dashed var(--border);background:var(--surface-2);transition:border-color .15s ease,background .15s ease;}
.dropzone.drag-over{border-color:var(--navy);background:var(--blue-soft);}
.import-row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.import-title{font-weight:700;font-size:13.5px;margin-bottom:3px;}
.import-sub{font-size:12px;color:var(--text-muted);line-height:1.5;max-width:520px;}

.section-title{font-size:15px;font-weight:800;color:var(--heading);margin:30px 0 4px;padding-top:22px;border-top:1px solid var(--border);}
.section-title:first-child{margin-top:0;padding-top:0;border-top:none;}
.section-sub{font-size:12.5px;color:var(--text-muted);margin:0 0 16px;}
.readonly-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 24px;font-size:13px;}
@media (max-width:640px){.readonly-grid{grid-template-columns:1fr;}}
.readonly-grid .k{color:var(--text-muted);padding:5px 0;}
.readonly-grid .v{font-weight:600;text-align:right;padding:5px 0;}
@media (max-width:640px){.readonly-grid .v{text-align:left;margin-bottom:6px;}}

.aml-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--border);}
.aml-row:last-child{border-bottom:none;}
.aml-label{font-size:12.5px;line-height:1.4;flex:1;}
.aml-yn{display:flex;gap:6px;flex-shrink:0;}
.aml-yn button{padding:5px 12px;font-size:12px;font-weight:600;border-radius:5px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;}
.aml-yn button.on-oui{background:var(--danger);border-color:var(--danger);color:#fff;}
.aml-yn button.on-non{background:var(--success);border-color:var(--success);color:#fff;}

.preco-item{border:1.5px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:10px;}
.preco-item.on{border-color:var(--navy);background:var(--blue-soft);}
.preco-head{display:flex;align-items:center;gap:10px;cursor:pointer;}
.preco-head input{width:16px;height:16px;}
.preco-head span{font-weight:700;font-size:13.5px;}
.preco-item textarea{margin-top:10px;}

.backlink{background:none;border:none;color:var(--text-muted);font-size:13px;font-weight:600;cursor:pointer;padding:0;margin-bottom:16px;display:inline-flex;align-items:center;gap:5px;}
.backlink:hover{color:var(--heading);}
.err-box{background:var(--danger-soft);border:1px solid var(--danger);color:var(--danger);border-radius:6px;padding:10px 12px;font-size:12.5px;margin-top:12px;}

.tabrow{display:flex;flex-wrap:wrap;gap:4px 26px;align-items:center;border-bottom:1px solid var(--border);margin:18px 0 20px;}
.tabbtn{cursor:pointer;border:none;background:none;font-family:inherit;padding:10px 2px;font-size:13.5px;font-weight:700;border-bottom:2.5px solid transparent;color:var(--text-muted);margin-bottom:-1px;}
.tabbtn:hover{color:var(--heading);}
.tabbtn.on{color:var(--heading);border-bottom-color:var(--accent);}
.tabbadge{display:inline-block;min-width:18px;padding:1px 6px;margin-left:6px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;text-align:center;}
.docrow-actions{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;}
/* Vraie zone de dépôt (data-drop-upload, voir bindDnd()) → pointillés. */
.doc-uploadbox{border:1.5px dashed var(--border);border-radius:8px;padding:14px 16px;margin-bottom:14px;background:var(--surface-2);display:flex;align-items:center;gap:14px;flex-wrap:wrap;transition:border-color .15s ease,background .15s ease;}
.doc-uploadbox.drag-over{border-color:var(--accent);background:var(--blue-soft);}
/* Encarts d'information de la fiche (identité, risque, accès…) : PAS des zones
   de dépôt → bordure pleine. Idem pour .advisor-panel (pointillés dans
   lib/ivo-theme.css, neutralisés ici). */
.link-account-box{border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:12px;background:var(--surface-2);}
.link-account-box input{margin-top:8px;}
.advisor-panel{border-style:solid;}
.info{margin-bottom:14px;}

/* --- ENCART "DOCUMENTS DEMANDÉS AU CLIENT" (onglet Justificatifs d'un compte)
   ⚠ LIÉ À renderRequestedDocsBox() dans lib/conseiller-app.js --- */
.reqlist{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.reqrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:13px;}
.reqrow .reqname{flex:1 1 200px;min-width:0;font-weight:600;overflow-wrap:anywhere;}
.reqadd{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.reqadd select{flex:1 1 220px;width:auto;margin:0;}
.reqadd input{flex:2 1 260px;width:auto;margin:0;}
.reqadd .btn{flex-shrink:0;}

/* --- MESSAGERIE (⚠ LIÉ À renderMessagesTab()/renderThreadHtml() dans
   lib/conseiller-app.js ; mêmes classes que dans espace-client/index.html) --- */
.thread{display:flex;flex-direction:column;gap:10px;height:400px;overflow-y:auto;padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);}
.msg{max-width:78%;padding:10px 13px;border-radius:12px;font-size:13.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;}
.msg.theirs{align-self:flex-start;background:var(--surface);border:1px solid var(--border);}
.msg.mine{align-self:flex-end;background:var(--navy);color:#fff;}
.msg-who{font-size:11px;font-weight:700;margin-bottom:3px;color:var(--heading);}
.msg-meta{font-size:11px;margin-top:5px;opacity:.7;}
.msgform{display:flex;gap:10px;align-items:flex-end;margin-top:12px;}
.msgform textarea{flex:1;min-height:64px;resize:vertical;}
@media (max-width:640px){.msgform{flex-direction:column;align-items:stretch;}}

/* ⚠ LIÉ À lib/conseiller-app.js (renderBibliothequeSection(), renderAccountBaseTab(),
   renderLibFileRow()) : base documentaire, glisser-déposer. */
.libgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;align-items:start;}
@media (max-width:860px){.libgrid{grid-template-columns:1fr;}}
.accgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:4px;}
@media (max-width:860px){.accgrid{grid-template-columns:1fr;}}
.libtoolbar{margin-bottom:10px;}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px;font-size:13px;}
.crumb{cursor:pointer;font-weight:700;color:var(--heading);padding:5px 9px;border-radius:6px;border:1.5px dashed transparent;}
.crumb:hover{background:var(--surface-2);}
.crumb.drag-over,.foldercard.drag-over{border-color:var(--accent);background:var(--blue-soft);}
.crumb-sep{color:var(--text-muted);}
.foldergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:14px;}
.foldercard{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);border-radius:10px;padding:10px 10px;background:var(--surface);cursor:grab;}
.foldercard .fc-open{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0;cursor:pointer;}
.fc-icon{font-size:22px;flex-shrink:0;}
.foldercard .advisor-toggle{padding:4px;}
.libsearchrow{display:flex;gap:10px;align-items:center;margin-bottom:12px;}
.libsearchrow .btn{flex-shrink:0;}
/* Barre d'actions de sélection : visible seulement quand quelque chose est
   coché (attribut hidden posé par updateLibSelCount()). */
.libbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;color:var(--text);background:var(--blue-soft);border:1px solid var(--blue-soft-border);border-radius:8px;padding:10px 12px;margin-bottom:12px;}
.libbar[hidden]{display:none;}
.libbar select{max-width:230px;width:auto;}
.fileitem.pending{border-color:var(--accent);background:var(--blue-soft);}
.fi-deposit{font-size:11.5px;font-weight:700;color:var(--heading);margin-top:3px;}
.linkbtn.strong{color:var(--accent);font-weight:800;}
.filelist{display:flex;flex-direction:column;gap:8px;}
.fileitem{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--surface);cursor:grab;}
.fileitem:active{cursor:grabbing;}
.fileitem input[type=checkbox]{flex-shrink:0;margin-top:3px;}
.fi-icon{font-size:20px;line-height:1.1;flex-shrink:0;}
.fi-main{flex:1 1 auto;min-width:0;}
.fi-name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fileitem .fi-name{white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3;}
.fi-meta{font-size:11.5px;color:var(--text-muted);margin-top:3px;}
.fi-actions{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;}
.linkbtn{background:none;border:none;padding:0;font-family:inherit;font-size:12px;font-weight:600;color:var(--heading);cursor:pointer;}
.linkbtn:hover{text-decoration:underline;}
.linkbtn.danger{color:var(--danger);}

/* ⚠ LIÉ À lib/conseiller-app.js (RISK_LEVELS + riskTagHtml()) : une classe
   risk-<clé> par niveau — mêmes clés que la contrainte SQL de client_internal
   (supabase/schema-v2-portail-client.sql section 11). */
.risk-tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--border);white-space:nowrap;flex-shrink:0;}
.risk-faible{background:var(--success-soft);border-color:var(--success);color:var(--success);}
.risk-modere{background:#FFF3D6;border-color:#E3B341;color:#7A5200;}
.risk-eleve{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
.risk-none{background:var(--surface-2);color:var(--text-muted);font-weight:600;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .risk-modere{background:#3A2E10;border-color:#8A6A1C;color:#F2C86B;}
}
:root[data-theme="dark"] .risk-modere{background:#3A2E10;border-color:#8A6A1C;color:#F2C86B;}
.dnd-target{display:flex;align-items:center;gap:8px;border:1.5px dashed var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--surface-2);}
.dnd-zone{border:1.5px dashed var(--border);border-radius:10px;padding:14px;background:var(--surface-2);min-height:200px;}
.dnd-zone .dz-title{font-weight:800;font-size:14px;color:var(--heading);}
.dnd-zone .dz-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
.dnd-target.drag-over,.dnd-zone.drag-over{border-color:var(--accent);background:var(--blue-soft);}
</style>
</head>
<body>

<div id="topbar"></div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../lib/pdf-fill.js"></script>
<script src="../client/config.js"></script>
<script src="../lib/conseiller-app.js"></script>
</body>
</html>
