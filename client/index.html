function shuffleArray(arr){
  arr = arr.slice();
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  }
  return arr;
}
function rollQuiz(key){
  var bank = QUIZ_BANK[key];
  var idx = Math.floor(Math.random()*bank.length);
  var order = shuffleArray(bank[idx].opts.map(function(_,i){return i;}));
  return {quizIdx:idx, quizOrder:order};
}
/* ⚠ TRÈS LIÉ AU RESTE DU PROJET : la forme de cet objet "state" (tous les
   noms de champs ci-dessous : nom, prenom, fonds.montant, pp.*, risque.*...)
   est reprise telle quelle par lib/pdf-fill.js (la carte "F" des coordonnées
   PDF fait littéralement put("nom", state.nom) pour chaque champ) et par
   lib/submit.js (qui lit state.personType, state.prenom, state.nom,
   state.contact.email, state.advisorEmail pour l'envoi au conseiller).
   Renommer un champ ici SANS répercuter le changement dans ces deux fichiers
   rend ce champ silencieusement invisible sur le PDF final ou dans l'email
   envoyé au conseiller — aucune erreur ne s'affiche, le champ reste juste vide. */

    morale:{denomination:"",formeJuridique:"",adresse:"",pays:"",rcs:"",activite:"",regimeFiscal:"IS",
      repNom:"",repPrenom:"",repFonction:"",repTel:"",repEmail:""},
    contact:{email:"",telephone:""},

    ppe:{vous:null, vousFonction:"", vousPays:"", conjointPPE:null, conjointFonction:"", conjointPays:"",
      famille:null, familleFonction:"", famillePays:""},
    beneficiaires:"", controle:"",
    fonds:{montant:"", origine:"france", origineDetail:"", natures:[], autreNature:""},

    pp:{residencePrincipale:"",residenceSecondaire:"",immobilierInvest:"",autresImmo:"",
      assuranceVie:"",comptesTitres:"",epargneLogement:"",epargneSalariale:"",autresFinanciers:"",
      actifsPro:"",liquidites:"",
      revenusPro:"",revenusLocatifs:"",revenusVM:"",revenusAutres:"",
      chargesEmprunt:"",chargesPension:"",chargesCourantes:"",chargesAutres:"",
      impotRevenu:"",impotLocatif:"",impotVM:""},
    pm:{locauxPro:"",immobilierInvest:"",autresImmo:"",
      comptesTitres:"",autresFinanciers:"",autresActifs:"",tresorerie:"",
      produitsExploitation:"",produitsFinanciers:"",produitsExceptionnels:"",
      chargesExploitation:"",chargesFinancieres:"",chargesExceptionnelles:"",
      impot:""},

    instruments:(function(){var o={};INSTRUMENTS.forEach(function(i){o[i.k]={connait:null,ops:null,declared:null,quizIdx:null,quizOrder:null,quizSelected:null};});return o;})(),
    gereSeul:null, gereSeulDepuis:"", mandatGestion:null, experiencePro:null, gains:null, pertes:null, conscienceRisque:null,

    objOrder: ["valoriser","completer","diversifier","securite","fiscalite","performance","succession"],

    projetsCourtTerme:"",

/* --- REPRISE D'UN BROUILLON / FUSION AVEC LES VALEURS PAR DÉFAUT ---
   Le brouillon vient du navigateur du client (localStorage) : il peut dater
   d'une ancienne version du questionnaire, ou être incomplet. On part donc
   TOUJOURS d'un état complet (defaultState()) et on y recopie seulement les
   valeurs enregistrées dont la forme est la bonne. Sans cela, un champ manquant
   (ex : state.ppe absent) ferait planter l'affichage : page blanche pour le
   client, sans message. Un champ inconnu du brouillon est simplement ignoré. */
function mergeDefaults(def, saved){
  if(!saved || typeof saved!=="object" || Array.isArray(saved)) return def;
  Object.keys(def).forEach(function(k){
    var d = def[k], s = saved[k];
    if(s===undefined) return; // absent du brouillon → valeur par défaut
    if(d && typeof d==="object" && !Array.isArray(d)){
      if(s && typeof s==="object" && !Array.isArray(s)) def[k] = mergeDefaults(d, s);
    } else if(Array.isArray(d)){
      if(Array.isArray(s)) def[k] = s;
    } else {
      def[k] = s;
    }
  });
  return def;
}
/* Un classement d'objectifs n'est repris que s'il contient exactement les
   mêmes clés que le classement par défaut (sinon : libellés "undefined"). */
function samePermutation(a, b){
  return Array.isArray(a) && a.length===b.length && b.every(function(k){ return a.indexOf(k) > -1; });
}

var state = mergeDefaults(defaultState(), load());
(function(){
  var d = defaultState();
  if(!samePermutation(state.objOrder, d.objOrder)) state.objOrder = d.objOrder;
  if(!samePermutation(state.objOrderMorale, d.objOrderMorale)) state.objOrderMorale = d.objOrderMorale;
  if(state.personType!=="physique" && state.personType!=="morale") state.personType = "physique";
  if(typeof state.step!=="number" || !(state.step >= -1) || state.step > STEPS.length-1) state.step = -1;
  state.step = Math.floor(state.step);
})();
if(typeof state.sentAt === "undefined"){ state.sentAt = null; }
if(typeof state.pdfDownloaded === "undefined"){ state.pdfDownloaded = false; }
if(typeof state.advisorEmail === "undefined"){ state.advisorEmail = ""; }
// Brouillon enregistré avec l'ancienne version (une page par étape) : on
// reprend au premier écran de l'étape où la personne s'était arrêtée.
if(typeof state.sub !== "number"){ state.sub = 0; }
INSTRUMENTS.forEach(function(ins){
  var v = state.instruments[ins.k];
  if(!v){ state.instruments[ins.k] = {connait:null,ops:null,declared:null,quizIdx:null,quizOrder:null,quizSelected:null}; return; }
  if(typeof v.declared === "undefined") v.declared = v.connait===true ? "know" : v.connait===false ? "dontknow" : null;
  if(typeof v.quizIdx === "undefined") v.quizIdx = null;
  if(typeof v.quizOrder === "undefined") v.quizOrder = null;
  if(typeof v.quizSelected === "undefined") v.quizSelected = null;
});
var visited = {}; // steps visited, for progress checkmarks
if(state.step >= 0){ for(var i=0;i<=state.step;i++) visited[i]=true; }

function load(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function getPath(obj, path){
  var parts = path.split(".");
  var cur = obj;
  for(var i=0;i<parts.length;i++){ if(cur==null) return undefined; cur = cur[parts[i]]; }
  return cur;
}
function setPath(obj, path, value){
  var parts = path.split(".");
  var cur = obj;
  for(var i=0;i<parts.length-1;i++){ cur = cur[parts[i]]; }
  cur[parts[parts.length-1]] = value;
}
function n(v){ var f = parseFloat(v); return isNaN(f) ? 0 : f; }
function fmt(v){ return n(v).toLocaleString('fr-FR'); }
function esc(s){ return (s||"").toString().replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

function showToast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 2200);
}

/* ==========================================================================
   MOTEUR D'AFFICHAGE / RENDER PRINCIPAL / AIGUILLAGE ÉCRAN D'ACCUEIL - ÉTAPES
   render() redessine toute la page à partir de "state". resetScroll = true
   quand on change d'écran (retour en haut de page), false quand on reste sur
   le même écran (une réponse vient d'être cochée).
   ========================================================================== */
var topbarPainted = false;
function render(resetScroll){
  if(!topbarPainted){
    document.getElementById("topbar").innerHTML = renderTopbar();
    topbarPainted = true;
  }
  var savedY = window.scrollY;
  var app = document.getElementById("app");
  if(state.step === -1){
    app.innerHTML = renderIntro();
  } else {
    app.innerHTML = progressBar() + '<div class="card">' + renderStep(state.step) + '</div>';
  }
  bindEvents();
  if(resetScroll){ window.scrollTo(0,0); } else { window.scrollTo(0, savedY); }
  // Nouvel écran avec un champ à remplir : le curseur s'y place tout seul —
  // uniquement à la souris (sur téléphone, cela ouvrirait le clavier à chaque
  // écran), et jamais sur les longues pages Patrimoine / Bilan.
  if(resetScroll && state.step >= 0){
    var k = STEPS[state.step].key;
    if(k!=="patrimoine" && k!=="recap" && window.matchMedia && window.matchMedia("(pointer:fine)").matches){
      var first = app.querySelector(".card input[data-bind]:not([type=date]), .card textarea[data-bind]");
      if(first){ try{ first.focus({preventScroll:true}); }catch(e){} }
    }
  }
}

/* ⚠ LIÉ À lib/ivo-theme.css (#topbar/.brand-badge — taille du logo réglée
   là-bas) ET au fichier assets/logo-ivo-white.png, référencé pareil dans
   index.html racine, lib/conseiller-app.js et espace-client/index.html. */
function renderTopbar(){
  return '' +
  '<div class="topbar-inner">' +
    '<div class="brand-badge"><img src="../assets/logo-ivo-white.png" alt="IVO Capital Partners"></div>' +
    '<div class="brand-context"><div class="brand-sub">Connaissance client</div></div>' +
  '</div>';
}

function isStepComplete(i){
  var isPM = state.personType==="morale";
  switch(STEPS[i].key){
    case "identite":
      var idOk = isPM ? !!state.morale.denomination : !!(state.nom && state.prenom);
      return idOk && !!state.contact.email;
    case "vigilance":
      var conjointOk = (state.personType==="physique" && (state.situationFamille==="Marié(e)" || state.situationFamille==="Pacsé(e)"))
        ? state.ppe.conjointPPE!==null : true;
      return state.ppe.vous!==null && state.ppe.famille!==null && conjointOk && !!state.fonds.montant;
    case "patrimoine":
      return true; // toutes les valeurs sont volontairement facultatives sur cette étape
    case "connaissance":
      var instrOk = INSTRUMENTS.every(function(ins){ var iv = state.instruments[ins.k]; return iv.connait!==null && iv.ops!==null; });
      return instrOk && state.gereSeul!==null && state.mandatGestion!==null && state.experiencePro!==null &&
        state.gains!==null && state.pertes!==null && state.conscienceRisque!==null;
    case "objectifs":
      return !!state.horizon;
    case "durabilite":
      return !!state.esg.inclure && !!state.esg.sfdr && !!state.esg.impact;
    case "profil":
      return !!(state.risque.perte && state.risque.reaction && state.risque.rendement);
    case "recap":
      return !!state.sentAt;
  }
  return false;
}

function progressBar(){
  var html = '<div class="progress">';
  STEPS.forEach(function(s,i){
    var complete = isStepComplete(i);
    var cls = "pstep";
    if(i===state.step) cls += " active";
    else if(complete) cls += " done";
    var mark = complete ? "✓" : (i+1);
    html += '<button class="'+cls+'" data-action="goto" data-step="'+i+'">' +
      '<div class="pdot">'+mark+'</div><div class="plabel">'+s.label+'</div></button>';
  });
  html += '</div>';
  // ⚠ Une seule barre d'avancement à l'écran : celle de la question en cours,
  // DANS la carte (.iprog). L'ancienne barre fine sous les pastilles d'étapes
  // a été retirée : les deux barres l'une au-dessus de l'autre faisaient doublon.
  // (l'espace sous les pastilles vient du margin-bottom de .progress, lib/ivo-theme.css)
  return html;
}

function renderIntro(){
  var hasDraft = !!load();
  return '' +
  '<div class="card">' +
    '<div class="eyebrow">Questionnaire de connaissance client · MIF 2</div>' +
    '<h1 class="step-title">Faisons connaissance</h1>' +
    '<p class="step-intro">Avant de vous accompagner dans vos investissements, la réglementation nous demande de mieux vous connaître : votre situation, votre expérience des marchés et vos objectifs. C\'est aussi dans votre intérêt&nbsp;: cela nous permet de vous proposer des solutions réellement adaptées.</p>' +
    '<div class="intro-list">' +
      '<div class="intro-item"><div class="n">1</div>Quelques informations sur vous et votre situation familiale</div>' +
      '<div class="intro-item"><div class="n">2</div>Des vérifications réglementaires standard (identique pour tous nos clients)</div>' +
      '<div class="intro-item"><div class="n">3</div>Votre patrimoine, vos revenus, votre expérience des marchés</div>' +
      '<div class="intro-item"><div class="n">4</div>Vos objectifs, votre horizon et vos préférences en matière de durabilité</div>' +
      '<div class="intro-item"><div class="n">5</div>Un profil de risque indicatif, que votre conseiller confirmera avec vous</div>' +
    '</div>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;">' +
      '<span class="pill">⏱ 8 à 10 minutes</span>' +
      '<span class="pill">🔒 Réponses confidentielles</span>' +
      '<span class="pill">↩ Vous pouvez revenir en arrière à tout moment</span>' +
    '</div>' +
    '<div class="actionrow">' +
      '<button class="btn btn-primary" data-action="start">Commencer</button>' +
      (hasDraft ? '<button class="btn btn-ghost" data-action="reset">Recommencer à zéro</button>' : '') +
    '</div>' +
  '</div>';

/* ==========================================================================
   MOTEUR "UNE QUESTION PAR ÉCRAN" / SOUS-ÉCRANS DE CHAQUE ÉTAPE / NAVIGATION
   Le questionnaire garde ses 7 étapes (barre du haut), mais chaque étape est
   découpée en ÉCRANS : une question (ou un petit groupe de champs liés) par
   écran, comme l'étape "Connaissances". Seules exceptions, affichées d'un
   bloc : "Patrimoine" (tableau de montants) et le "Bilan" final.

   - screensFor(clé d'étape) renvoie la liste des écrans VISIBLES de l'étape
     (certains dépendent des réponses : société / particulier, marié ou non…).
   - state.sub = numéro de l'écran en cours DANS l'étape (0 = premier).
   - goNext() / goPrev() passent à l'écran suivant / précédent, et changent
     d'étape en bout de liste (en arrivant par "Précédent" on tombe sur le
     DERNIER écran de l'étape d'avant).
   - Un écran marqué "auto" passe tout seul à la suite dès qu'une réponse est
     choisie (questions à choix unique). Pour couper ce comportement partout :
     mettre AUTO_ADVANCE à false ci-dessous.

   ⚠ LIÉ À lib/pdf-fill.js et lib/submit.js : ce découpage ne change QUE
   l'affichage. Les noms des champs de "state" (data-bind / data-path) sont
   strictement les mêmes qu'avant — voir la note sur defaultState().
   ⚠ Version précédente (toutes les questions d'une étape sur une page) :
   client/index-version-classique.html. Pour y revenir, renommer ce fichier-là
   en index.html.
   ========================================================================== */
var AUTO_ADVANCE = true;
var AUTO_DELAY_MS = 280; // le temps de voir sa réponse surlignée avant de passer à la suite

function screensFor(stepKey){
  switch(stepKey){
    case "identite": return screensIdentite();
    case "vigilance": return screensVigilance();
    case "connaissance": return screensConnaissance();
    case "objectifs": return screensObjectifs();
    case "durabilite": return screensDurabilite();
    case "profil": return screensProfil();
  }
  return [{id:stepKey}]; // patrimoine, recap : un seul bloc, rendu par leur propre fonction
}

function currentScreens(){ return screensFor(STEPS[state.step].key); }

/* Écran en cours, en rattrapant un numéro devenu trop grand (une réponse
   modifiée peut retirer des écrans conditionnels). */
function currentScreen(){
  var list = currentScreens();
  if(!(state.sub >= 0)) state.sub = 0;
  if(state.sub > list.length-1) state.sub = list.length-1;
  return list[state.sub];
}

function renderStep(i){
  var key = STEPS[i].key;
  if(key==="patrimoine") return stepPatrimoine();
  if(key==="recap") return stepRecap();

  var list = screensFor(key);
  var sc = currentScreen();
  var html = '<div class="eyebrow">Étape '+(i+1)+' / 7 · '+STEPS[i].label+'</div>';
  if(list.length > 1){
    html += '<div class="iprog"><span>'+(sc.counter||"Question")+' '+(state.sub+1)+' sur '+list.length+'</span>' +
      '<div class="iprog-bar"><i style="width:'+Math.round(((state.sub+1)/list.length)*100)+'%"></i></div></div>';
  }
  html += '<h2 class="step-title">'+sc.title+'</h2>';
  if(sc.intro) html += '<p class="step-intro">'+sc.intro+'</p>';
  html += sc.body();

  var isFirst = (i===0 && state.sub===0);
  var isLastOfStep = state.sub === list.length-1;
  var nextLabel = isLastOfStep ? (sc.nextLabel || "Continuer →") : "Suivant →";
  html += '<div class="navrow">' +
    (isFirst ? '<span></span>' : '<button class="btn btn-ghost" data-action="prev">← Précédent</button>') +
    '<button class="btn btn-primary" data-action="next">'+nextLabel+'</button>' +
  '</div>';
  return html;
}

/* Boutons Précédent / Continuer des étapes en un seul bloc (Patrimoine). */
function navButtons(opts){
  opts = opts || {};
  var back = '<button class="btn btn-ghost" data-action="prev">← Précédent</button>';
  var next = opts.nextLabel || "Continuer →";
  var nextBtn = state.step < STEPS.length-1 ? '<button class="btn btn-primary" data-action="next">'+next+'</button>' : '';
  return '<div class="navrow">'+back+nextBtn+'</div>';
}

var autoTimer = null;
function cancelAuto(){ if(autoTimer){ clearTimeout(autoTimer); autoTimer = null; } }

/* where = "first" (arrivée par Suivant / clic sur une étape) ou "last"
   (arrivée par Précédent). */
function gotoStep(newStep, where){
  cancelAuto();
  visited[state.step] = true;
  state.step = Math.max(0, Math.min(STEPS.length-1, newStep));
  visited[state.step] = true;
  state.sub = where==="last" ? Math.max(0, currentScreens().length-1) : 0;
  save(); render(true);
}
function goNext(){
  cancelAuto();
  var list = currentScreens();
  currentScreen(); // rattrape state.sub si besoin
  if(state.sub < list.length-1){ state.sub++; save(); render(true); }
  else if(state.step < STEPS.length-1){ gotoStep(state.step+1, "first"); }
}
function goPrev(){
  cancelAuto();
  currentScreen();
  if(state.sub > 0){ state.sub--; save(); render(true); }
  else if(state.step > 0){ gotoStep(state.step-1, "last"); }
}

/* Appelé après chaque réponse à choix : si l'écran en cours est "auto" (et que
   sa condition éventuelle est remplie), on passe à la suite après un court
   délai. sc.auto = true, ou une fonction qui renvoie true/false. */
function maybeAutoAdvance(){
  cancelAuto();
  if(!AUTO_ADVANCE || state.step < 0) return;
  var key = STEPS[state.step].key;
  if(key==="patrimoine" || key==="recap") return;
  var sc = currentScreen();
  var ok = typeof sc.auto==="function" ? sc.auto() : !!sc.auto;
  if(!ok) return;
  var stepAt = state.step, subAt = state.sub;
  autoTimer = setTimeout(function(){
    autoTimer = null;
    if(state.step===stepAt && state.sub===subAt) goNext();
  }, AUTO_DELAY_MS);
}

/* Question à choix : libellé + boutons (chips). */
function choiceField(path, label, options){
  var cur = getPath(state, path);
  return '<div class="field">'+(label ? '<label class="flabel">'+label+'</label>' : '')+'<div class="chips">' +
    options.map(function(o){ return chip(path, o[0], cur, o[1]); }).join('') +
  '</div></div>';
}

   ========================================================================== */
function stepPatrimoine(){
  var isPM = state.personType==="morale";
  var html = '<div class="eyebrow">Étape 3 / 7</div><h2 class="step-title">Votre situation patrimoniale</h2>' +
    '<p class="step-intro">Ces montants (approximatifs, en milliers d\'euros) nous permettent de vérifier que votre projet d\'investissement reste cohérent avec l\'ensemble de votre patrimoine — c\'est une obligation du \"test d\'adéquation\". Vous pouvez laisser une case vide si vous préférez en discuter directement avec votre conseiller.</p>';

  if(!isPM){
    html += subhead("Actifs immobiliers (K€)") +
      fieldRow([kField("pp.residencePrincipale","Résidence principale"), kField("pp.residenceSecondaire","Résidence(s) secondaire(s)")]) +
      fieldRow([kField("pp.immobilierInvest","Immobilier d'investissement"), kField("pp.autresImmo","Autres (SCI, SCPI…)")]) +
      subhead("Actifs financiers (K€)") +
      fieldRow([kField("pp.assuranceVie","Assurance vie / capitalisation"), kField("pp.comptesTitres","Comptes-titres, PEA")]) +
      fieldRow([kField("pp.epargneLogement","Épargne logement (PEL, CEL)"), kField("pp.epargneSalariale","Épargne salariale")]) +
      fieldRow([kField("pp.autresFinanciers","Autres actifs financiers"), kField("pp.actifsPro","Actifs professionnels")]) +
      fieldRow([kField("pp.liquidites","Liquidités")]) +
      statTile("Patrimoine total estimé", patrimoineTotal()) +
      subhead("Revenus et charges annuels (K€)") +
      fieldRow([kField("pp.revenusPro","Revenus professionnels"), kField("pp.chargesEmprunt","Charges — emprunt(s)")]) +
      fieldRow([kField("pp.revenusLocatifs","Revenus locatifs"), kField("pp.chargesPension","Charges — pension(s)")]) +
      fieldRow([kField("pp.revenusVM","Revenus de valeurs mobilières"), kField("pp.chargesCourantes","Dépenses courantes")]) +
      fieldRow([kField("pp.revenusAutres","Autres revenus"), kField("pp.chargesAutres","Autres charges")]) +
      subhead("Situation fiscale (K€) — optionnel") +
      fieldRow([kField("pp.impotRevenu","Impôt sur le revenu"), kField("pp.impotLocatif","Impôts locatifs")]) +
      fieldRow([kField("pp.impotVM","Impôts sur valeurs mobilières")]);
  } else {
    html += subhead("Actifs immobiliers (K€)") +
      fieldRow([kField("pm.locauxPro","Locaux professionnels"), kField("pm.immobilierInvest","Immobilier d'investissement")]) +
      fieldRow([kField("pm.autresImmo","Autres (SCI, SCPI…)")]) +
      subhead("Actifs financiers et trésorerie (K€)") +
      fieldRow([kField("pm.comptesTitres","Comptes-titres"), kField("pm.autresFinanciers","Autres actifs financiers")]) +
      fieldRow([kField("pm.autresActifs","Autres actifs"), kField("pm.tresorerie","Trésorerie")]) +
      statTile("Actifs totaux estimés", patrimoineTotal()) +
      subhead("Produits et charges annuels (K€)") +
      fieldRow([kField("pm.produitsExploitation","Produits d'exploitation"), kField("pm.chargesExploitation","Charges d'exploitation")]) +
      fieldRow([kField("pm.produitsFinanciers","Produits financiers"), kField("pm.chargesFinancieres","Charges financières")]) +
      fieldRow([kField("pm.produitsExceptionnels","Produits exceptionnels"), kField("pm.chargesExceptionnelles","Charges exceptionnelles")]) +
      subhead("Situation fiscale (K€)") +
      fieldRow([kField("pm.impot","Impôt (IS, BNC, BIC, BA)")]);
  }

  var montant = n(state.fonds.montant);
  var total = patrimoineTotal()*1000;
  if(montant>0 && total>0){
    var ratio = Math.round((montant/total)*100);
    html += '<div class="info"><span class="ic">💡</span><div>Le montant envisagé (<b>'+fmt(montant)+' €</b>) représente environ <b>'+ratio+'%</b> de votre patrimoine total estimé. Votre conseiller en tiendra compte dans ses recommandations.</div></div>';
  }

  html += navButtons();
  return html;
}
function patrimoineTotal(){
  var isPM = state.personType==="morale";
  if(!isPM){
    var pp = state.pp;
    return n(pp.residencePrincipale)+n(pp.residenceSecondaire)+n(pp.immobilierInvest)+n(pp.autresImmo)+
      n(pp.assuranceVie)+n(pp.comptesTitres)+n(pp.epargneLogement)+n(pp.epargneSalariale)+n(pp.autresFinanciers)+
      n(pp.actifsPro)+n(pp.liquidites);
  } else {
    var pm = state.pm;
    return n(pm.locauxPro)+n(pm.immobilierInvest)+n(pm.autresImmo)+n(pm.comptesTitres)+n(pm.autresFinanciers)+
      n(pm.autresActifs)+n(pm.tresorerie);
  }
}

/* ---------- STEP 4 : CONNAISSANCE ----------
   Écrans de l'étape (voir le moteur "UNE QUESTION PAR ÉCRAN" plus haut) :
   - UN INSTRUMENT PAR ÉCRAN — son titre, la question de connaissance (réponse
     directe, plus de "je connais / je ne connais pas") et, juste dessous, la
     question sur le nombre d'opérations des 12 derniers mois ;
   - puis une question oui/non par écran (gère seul, mandat, gains, pertes...).
   ⚠ LIÉ À lib/pdf-fill.js : le PDF ne lit que state.instruments[k].connait
   (true/false) et .ops ("aucune"/"1"/"5") — ces deux valeurs doivent rester
   renseignées ici, quel que soit l'écran. connait = la réponse choisie est la
   bonne ; "Je ne sais pas" ou une mauvaise réponse = false. */
function ensureQuiz(k){
  var v = state.instruments[k];
  if(v.quizIdx===null || v.quizIdx===undefined || !QUIZ_BANK[k][v.quizIdx] || !v.quizOrder){
    var r = rollQuiz(k);
    v.quizIdx = r.quizIdx;
    v.quizOrder = r.quizOrder;
    save();
  }
}

function instrumentBody(ins){
  var v = state.instruments[ins.k];
  ensureQuiz(ins.k);
  var entry = QUIZ_BANK[ins.k][v.quizIdx];
  var picked = v.quizSelected;
  if(picked===null && v.connait===false) picked = -1; // ancien brouillon "je ne connais pas"

  var html = '<div class="field"><label class="flabel">'+entry.q+'</label><div class="qa-opts">';
  v.quizOrder.forEach(function(optIdx){
    html += '<button class="qa-opt'+(picked===optIdx?" on":"")+'" data-action="quizAnswer" data-key="'+ins.k+'" data-value="'+optIdx+'">'+entry.opts[optIdx]+'</button>';
  });
  html += '<button class="qa-opt qa-idk'+(picked===-1?" on":"")+'" data-action="quizIdk" data-key="'+ins.k+'">Je ne sais pas</button>';
  html += '</div></div>';

  html += '<div class="field"><label class="flabel">Combien d\'opérations avez-vous réalisées sur des '+ins.n.charAt(0).toLowerCase()+ins.n.slice(1)+' au cours des 12 derniers mois ?</label><div class="chips">' +
    chip("instruments."+ins.k+".ops","aucune",v.ops,"Aucune") +
    chip("instruments."+ins.k+".ops","1",v.ops,"1 à 4") +
    chip("instruments."+ins.k+".ops","5",v.ops,"5 ou plus") +
  '</div></div>';
  return html;
}

function screensConnaissance(){
  var S = [];
  INSTRUMENTS.forEach(function(ins){
    // pas de passage automatique ici : deux questions sur le même écran
    S.push({id:"instr-"+ins.k, title:ins.n, intro:ins.d, body:function(){ return instrumentBody(ins); }});
  });
  var T = "Votre expérience des marchés";
  S.push({id:"gereSeul", title:T, auto:function(){ return state.gereSeul===false; }, body:function(){
    var h = yesNoField("gereSeul","Gérez-vous vous-même votre portefeuille ?");

/* ==========================================================================
   ÉTAPE 7 / PROFIL DE RISQUE / TOLÉRANCE AUX PERTES / PROFIL INDICATIF
   ⚠ LIÉ À computeProfile() juste en dessous (calcul du profil affiché) et à
   lib/conseiller-app.js suggestProfile() qui refait le MÊME calcul côté
   conseiller : changer un barème ici sans l'autre donne deux profils différents.
   ========================================================================== */
function screensProfil(){
  var S = [];
  var blurb = "Ces trois questions nous aident à cerner votre tolérance au risque. Le profil obtenu est indicatif : votre conseiller le validera avec vous lors de votre échange.";

  S.push({id:"perte", title:"Votre rapport au risque", intro:blurb, auto:true, body:function(){
    return '<div class="field"><label class="flabel">Pour un investissement de 100 000 €, quelle baisse temporaire seriez-vous prêt(e) à accepter ?</label>' +
      optCard("risque.perte","p1",state.risque.perte,"Jusqu'à 10 000 €", "") +
      optCard("risque.perte","p2",state.risque.perte,"Jusqu'à 20 000 €", "") +
      optCard("risque.perte","p3",state.risque.perte,"Jusqu'à 30 000 €", "") +
      optCard("risque.perte","p4",state.risque.perte,"Plus de 30 000 €", "") +
    '</div>';
  }});

  S.push({id:"reaction", title:"Votre rapport au risque", auto:true, body:function(){
    return '<div class="field"><label class="flabel">Si la valeur de vos investissements chutait brusquement, quelle serait votre réaction ?</label>' +
      optCard("risque.reaction","vendre",state.risque.reaction,"Je vends pour limiter mes pertes","") +
      optCard("risque.reaction","conserver",state.risque.reaction,"Je conserve, dans une optique de long terme","") +
      optCard("risque.reaction","investir",state.risque.reaction,"J'en profite pour investir davantage","") +
    '</div>';
  }});

  // Dernier écran : pas de passage automatique, pour laisser lire le profil
  // indicatif qui s'affiche dès que les trois réponses sont données.
  S.push({id:"rendement", title:"Votre rapport au risque", nextLabel:"Voir mon bilan →", body:function(){
    var h = '<div class="field"><label class="flabel">Quel couple rendement / risque vous correspond le mieux ?</label>' +
      optCard("risque.rendement","r1",state.risque.rendement,"Viser 3% de performance, en acceptant jusqu'à 6% de perte","") +
      optCard("risque.rendement","r2",state.risque.rendement,"Viser 5% de performance, en acceptant jusqu'à 10% de perte","") +
      optCard("risque.rendement","r3",state.risque.rendement,"Viser 15% de performance, en acceptant jusqu'à 30% de perte","") +
    '</div>';
    if(state.risque.perte && state.risque.reaction && state.risque.rendement) h += profileBlock(computeProfile());
    return h;
  }});
  return S;
}

function computeProfile(){
  var s1 = {p1:1,p2:2,p3:3,p4:4}[state.risque.perte] || 0;
  var s2 = {vendre:1,conserver:2.5,investir:4}[state.risque.reaction] || 0;
  var s3 = {r1:1,r2:2.5,r3:4}[state.risque.rendement] || 0;
  var avg = (s1+s2+s3)/3;
  if(avg <= 1.6) return {name:"Prudent", txt:"Vous préférez des rendements modérés et réguliers (en moyenne 3%). Vous prenez peu de risques de perte en capital (en moyenne -6%). L'horizon de placement minimum recommandé est de 5 ans."};
  if(avg <= 2.6) return {name:"Équilibré", txt:"Vous préférez valoriser votre capital et acceptez des rendements moyens (en moyenne 5%). Vous prenez des risques modérés de perte en capital (en moyenne -10%). L'horizon de placement minimum recommandé est de 5 ans."};
  if(avg <= 3.5) return {name:"Dynamique", txt:"Vous préférez une valorisation active de votre capital et recherchez des rendements élevés (en moyenne 15%). Vous prenez des risques importants de perte en capital (en moyenne -30%). L'horizon de placement minimum recommandé est de 7 ans."};
  return {name:"Offensif / Discrétionnaire", txt:"Vous acceptez des fluctuations élevées et des risques forts de moins-value, avec une grande latitude laissée à votre conseiller sur l'allocation. L'horizon de placement minimum recommandé est de 8 ans."};
}

function profileBlock(p){
  return '<div class="profilecard"><div class="pname">Profil indicatif : '+p.name+'</div><p>'+p.txt+'</p>' +
    '<div class="disclaimer">* Hypothèses non contractuelles, données à titre indicatif. Ce profil sera confirmé par votre conseiller IVO Capital Partners.</div></div>';
}

/* ==========================================================================
   BILAN / RÉCAPITULATIF / CHOIX DU CONSEILLER / ENVOI
   Page d'un seul bloc (pas d'écrans). ⚠ LIÉ À lib/submit.js (envoi) et à
   client/config.js (liste des conseillers).
   ========================================================================== */
function stepRecap(){
  var missing = [];
  if(state.personType==="physique" && !state.nom) missing.push("votre nom");
  if(state.personType==="morale" && !state.morale.denomination) missing.push("la dénomination de votre société");
  if(!state.contact.email) missing.push("votre email");

  var html = '<div class="eyebrow">Bilan</div><h2 class="step-title">Votre synthèse</h2>' +
    '<p class="step-intro">Voici le récapitulatif de vos réponses. Vous pouvez encore modifier chaque section, puis transmettre cette synthèse à votre conseiller — il s\'appuiera sur celle-ci pour finaliser votre dossier ; vous n\'aurez ensuite qu\'à le valider.</p>';

  if(missing.length){
    html += '<div class="banner-warn">Merci de compléter '+missing.join(" et ")+' pour permettre à votre conseiller de vous recontacter (<a data-action="goto" data-step="0" href="#">modifier</a>).</div>';
  }

  html += recapSection(0,"Identité", identiteRecapRows());
  html += recapSection(1,"Vigilance réglementaire", vigilanceRecapRows());
  html += recapSection(2,"Patrimoine", patrimoineRecapRows());
  html += recapSection(3,"Connaissances & expérience", connaissanceRecapRows());
  html += recapSection(4,"Objectifs & horizon", objectifsRecapRows());
  html += recapSection(5,"Durabilité", durabiliteRecapRows());
  html += recapSection(6,"Profil de risque", profilRecapRows());

  /* ⚠ LIÉ À client/config.js : la liste des conseillers proposée ici vient de
     window.IVO_CONFIG.ADVISORS (tableau {name, email}) — pour ajouter/retirer
     un conseiller de ce menu déroulant, modifiez client/config.js, pas ce fichier. */
  html += '<div class="field"><label class="flabel">Votre conseiller IVO Capital Partners</label>' +
    '<select data-bind="advisorEmail">' +
      '<option value="">— Sélectionner votre conseiller —</option>' +
      (window.IVO_CONFIG && window.IVO_CONFIG.ADVISORS ? window.IVO_CONFIG.ADVISORS.map(function(a){
        return '<option value="'+esc(a.email)+'"'+(state.advisorEmail===a.email?" selected":"")+'>'+esc(a.name)+'</option>';
      }).join("") : "") +
    '</select></div>';

  html += '<div class="checkline"><input type="checkbox" id="certifie" data-action="check" data-path="certifie" '+(state.certifie?"checked":"")+'>' +
    '<label for="certifie">Je certifie que les informations renseignées ci-dessus sont exactes et sincères, et je m\'engage à informer IVO Capital Partners de toute modification significative de ma situation.</label></div>';

  var canSend = state.certifie && !missing.length && !!state.advisorEmail;
  html += '<div class="finalbox" id="finalbox">' +
    (state.sentAt ?
      '<div class="finalbox-title" style="color:var(--success)">✓ Envoyé le '+new Date(state.sentAt).toLocaleString('fr-FR')+'</div>' +
      '<p class="finalbox-text">Votre conseiller a reçu automatiquement votre fiche pré-remplie par email. Vous n\'avez rien d\'autre à faire.</p>'
      :
      '<div class="finalbox-title">Dernière étape</div>' +
      '<p class="finalbox-text">Votre fiche sera automatiquement transmise, au format PDF officiel, à votre conseiller. Aucune autre action de votre part.</p>'
    ) +
    '<div class="actionrow" style="justify-content:center">' +
      '<button class="btn btn-primary btn-large" id="sendBtn" data-action="submitToAdvisor"'+(canSend?"":" disabled")+'>✉ '+(state.sentAt?"Renvoyer à mon conseiller":"Terminer et envoyer à mon conseiller")+'</button>' +
    '</div>' +
    (!canSend ? '<div class="finalbox-hint">'+(missing.length ? "Complétez les champs manquants ci-dessus" : !state.advisorEmail ? "Sélectionnez votre conseiller ci-dessus" : "Cochez la case de certification ci-dessus")+' pour activer l\'envoi.</div>' : '') +
    '<div id="sendError"></div>' +
  '</div>' +
  '<div class="actionrow actionrow-secondary">' +
    '<button class="btn btn-ghost" data-action="downloadPdf">📄 Garder une copie du PDF</button>' +
    '<button class="btn btn-ghost" data-action="copy">📋 Copier la synthèse (texte)</button>' +
  '</div>';

  html += '<div class="navrow"><button class="btn btn-ghost" data-action="prev">← Précédent</button><span></span></div>';
  return html;
}

function recapSection(step, title, rows){
  var body = '<table><tbody>';
  rows.forEach(function(r){ body += '<tr><td class="k">'+r[0]+'</td><td class="v">'+ (r[1] || "—") +'</td></tr>'; });
  body += '</tbody></table>';
  return '<div class="recap-sec"><div class="recap-head"><h3>'+title+'</h3><a href="#" data-action="goto" data-step="'+step+'">Modifier</a></div><div class="recap-body"><div class="kdiv">'+body+'</div></div></div>';
}

function yn(v){ return v===true?"Oui":v===false?"Non":null; }

function identiteRecapRows(){
  if(state.personType==="physique"){
    var rows = [
      ["Nom complet", esc(state.prenom+" "+state.nom)],
      ["Date de naissance", esc(state.dateNaissance)],
      ["Profession", esc(state.profession)],
      ["Situation de famille", esc(state.situationFamille)+(state.regimeMatrimonial?" — "+esc(state.regimeMatrimonial):"")],
      ["Enfants / personnes à charge", esc(state.nbEnfants)],
      ["Email", esc(state.contact.email)],
      ["Téléphone", esc(state.contact.telephone)]
    ];
    if(state.renseignerConjoint){ rows.push(["Conjoint", esc(state.conjoint.prenom+" "+state.conjoint.nom+" ("+state.conjoint.dateNaissance+")")]); }
    return rows;
  }
  return [
    ["Dénomination", esc(state.morale.denomination)],
    ["Forme juridique", esc(state.morale.formeJuridique)],
    ["RCS", esc(state.morale.rcs)],
    ["Activité", esc(state.morale.activite)],
    ["Régime fiscal", esc(state.morale.regimeFiscal)],
    ["Représentant", esc(state.morale.repPrenom+" "+state.morale.repNom+" — "+state.morale.repFonction)],
    ["Email", esc(state.contact.email)],
    ["Téléphone", esc(state.contact.telephone)]
  ];
}
function vigilanceRecapRows(){
  var rows = [["Personne politiquement exposée (vous)", yn(state.ppe.vous)]];
  if(state.ppe.vous) rows.push(["→ Fonction / pays", esc(state.ppe.vousFonction+" / "+state.ppe.vousPays)]);
  if(state.ppe.conjointPPE!=null) rows.push(["Conjoint PPE", yn(state.ppe.conjointPPE)]);
  rows.push(["Entourage PPE", yn(state.ppe.famille)]);
  rows.push(["Montant envisagé", state.fonds.montant ? fmt(state.fonds.montant)+" €" : null]);
  rows.push(["Origine géographique", state.fonds.origine==="france"?"France métropolitaine":("Hors France — "+esc(state.fonds.origineDetail))]);
  rows.push(["Nature des fonds", state.fonds.natures.length ? esc(state.fonds.natures.join(", ")) : null]);
  return rows;
}
function patrimoineRecapRows(){
  var rows = [["Patrimoine total estimé", patrimoineTotal()>0 ? fmt(patrimoineTotal())+" K€" : null]];
  var src = state.personType==="morale" ? state.pm : state.pp;
  for(var k in src){ if(src[k]!=="" && src[k]!=null){ rows.push([k, fmt(src[k])+" K€"]); } }
  return rows;
}
function connaissanceRecapRows(){
  var rows = [];
  INSTRUMENTS.forEach(function(ins){
    var v = state.instruments[ins.k];
    if(v.connait!=null || v.ops!=null){
      rows.push([ins.n, (v.connait===true?"Connaît":v.connait===false?"Ne connaît pas":"—") + (v.ops?" · "+({aucune:"aucune opération",1:"1 à 4 opérations",5:"5 opérations ou plus"}[v.ops]):"")]);
    }
  });
  rows.push(["Gère seul son portefeuille", yn(state.gereSeul)]);
  rows.push(["Déjà eu un mandat de gestion", yn(state.mandatGestion)]);
  rows.push(["Expérience professionnelle finance", yn(state.experiencePro)]);
  rows.push(["Gains déjà réalisés", yn(state.gains)]);
  rows.push(["Pertes déjà subies", yn(state.pertes)]);
  rows.push(["Conscience du risque de perte en capital", yn(state.conscienceRisque)]);
  return rows;
}
function objectifsRecapRows(){
  var isPM = state.personType==="morale";
  var labels = isPM?OBJ_LABELS_MORALE:OBJ_LABELS_PHYSIQUE;
  var order = isPM?state.objOrderMorale:state.objOrder;
  var rows = [["Priorités (1 = la plus importante)", order.map(function(k,i){return (i+1)+". "+labels[k];}).join(" · ")]];
  var hMap={court:"Court terme (- de 2 ans)",moyen:"Moyen terme (2 à 5 ans)",long:"Long terme (5 à 8 ans)",tlong:"Très long terme (+ de 8 ans)"};
  rows.push(["Horizon d'investissement", state.horizon?hMap[state.horizon]:null]);
  rows.push(["Projets court terme / besoins de revenus", esc(state.projetsCourtTerme)]);
  return rows;
}
function durabiliteRecapRows(){
  var incMap={oui:"Oui",non:"Non",nonExprime:"Ne s'est pas exprimé"};
  var themMap={environnementale:"Environnementale",sociale:"Sociale",gouvernance:"Bonne gouvernance"};
  var sfdrMap={convient:"La répartition me convient",pasImportant:"Je n'y attache pas d'importance",revoir:"Je souhaite la revoir"};
  var impMap={non:"Satisfait(e) de la situation actuelle",oui:"Souhaite davantage d'investissements à impact"};
  return [
    ["Inclusion de critères ESG", state.esg.inclure?incMap[state.esg.inclure]:null],
    ["Thématique privilégiée", state.esg.thematique?themMap[state.esg.thematique]:null],
    ["Répartition SFDR", state.esg.sfdr?sfdrMap[state.esg.sfdr]:null],
    ["Investissements à impact", state.esg.impact?impMap[state.esg.impact]:null]
  ];
}
function profilRecapRows(){
  var rows = [];
  var perteMap={p1:"Jusqu'à 10 000 €",p2:"Jusqu'à 20 000 €",p3:"Jusqu'à 30 000 €",p4:"Plus de 30 000 €"};
  var reacMap={vendre:"Vend pour limiter les pertes",conserver:"Conserve dans une optique long terme",investir:"En profite pour investir"};
  var rendMap={r1:"3% visé / 6% de perte acceptée",r2:"5% visé / 10% de perte acceptée",r3:"15% visé / 30% de perte acceptée"};
  rows.push(["Perte acceptée sur 100 000€", state.risque.perte?perteMap[state.risque.perte]:null]);
  rows.push(["Réaction à une baisse brutale", state.risque.reaction?reacMap[state.risque.reaction]:null]);
  rows.push(["Couple rendement / risque", state.risque.rendement?rendMap[state.risque.rendement]:null]);
  if(state.risque.perte && state.risque.reaction && state.risque.rendement){
    rows.push(["Profil indicatif", "<b>"+computeProfile().name+"</b>"]);
  }
  return rows;
}

function buildSyntheseText(){
  var lines = [];
  lines.push("SYNTHÈSE — QUESTIONNAIRE DE CONNAISSANCE CLIENT");
  lines.push("IVO Capital Partners — généré le " + new Date().toLocaleDateString('fr-FR'));
  lines.push("");
  function sec(title, rows){
    lines.push("— " + title.toUpperCase() + " —");
    rows.forEach(function(r){
      var v = (r[1]||"—").replace(/<[^>]+>/g,"");
      lines.push(r[0] + " : " + v);
    });
    lines.push("");
  }
  sec("Identité", identiteRecapRows());
  sec("Vigilance réglementaire", vigilanceRecapRows());
  sec("Patrimoine", patrimoineRecapRows());
  sec("Connaissances & expérience", connaissanceRecapRows());
  sec("Objectifs & horizon", objectifsRecapRows());
  sec("Durabilité", durabiliteRecapRows());
  sec("Profil de risque", profilRecapRows());
  lines.push("Le client certifie l'exactitude des informations : " + (state.certifie ? "Oui" : "Non — à confirmer"));
  return lines.join("\n");
}

/* ==========================================================================
   ÉCOUTEURS D'ÉVÉNEMENTS / CLICS / SAISIE / AIGUILLAGE DES ACTIONS
   Rappelé après CHAQUE render() : la page vient d'être redessinée, tous les
   éléments sont neufs (aucun risque de double écouteur).
   ========================================================================== */
function bindEvents(){
  var app = document.getElementById("app");

  app.querySelectorAll("[data-bind]").forEach(function(el){
    el.addEventListener("input", function(){
      setPath(state, el.getAttribute("data-bind"), el.value);
      save();
      if(el.tagName==="SELECT"){ render(false); return; }
      if(el.classList.contains("patr-input")){
        var tile = app.querySelector(".stattile .sv");
        if(tile){ tile.innerHTML = fmt(patrimoineTotal())+' <small>K€</small>'; }
      }
    });
    // Touche Entrée dans un champ d'une ligne = "Suivant" (sauf sur l'étape
    // Patrimoine et le Bilan, qui sont de longues pages, et dans les zones de
    // texte où Entrée sert à aller à la ligne).
    if(el.tagName==="INPUT"){
      el.addEventListener("keydown", function(e){
        if(e.key!=="Enter") return;
        var k = STEPS[state.step] && STEPS[state.step].key;
        if(k==="patrimoine" || k==="recap") return;
        e.preventDefault();
        goNext();
      });
    }
  });

  app.querySelectorAll("[data-action]").forEach(function(el){
    el.addEventListener("click", function(e){
      e.preventDefault();
      var action = el.getAttribute("data-action");
      if(action==="start"){ cancelAuto(); state.step=0; state.sub=0; visited[0]=true; save(); render(true); return; }
      if(action==="reset"){
        if(confirm("Recommencer le questionnaire à zéro ? Vos réponses actuelles seront perdues.")){
          cancelAuto(); state = defaultState(); visited={}; save(); render(true);
        }
        return;
      }
      /* --- NAVIGATION (voir le moteur "UNE QUESTION PAR ÉCRAN") --- */
      if(action==="goto"){ gotoStep(parseInt(el.getAttribute("data-step"),10), "first"); return; }
      if(action==="next"){ goNext(); return; }
      if(action==="prev"){ goPrev(); return; }
      /* --- RÉPONSES À CHOIX : enregistre, réaffiche, puis passe seul à la
         suite si l'écran est "auto" (maybeAutoAdvance()) --- */
      if(action==="set"){ setPath(state, el.getAttribute("data-path"), el.getAttribute("data-value")); save(); render(false); maybeAutoAdvance(); return; }
      if(action==="setbool"){ setPath(state, el.getAttribute("data-path"), el.getAttribute("data-value")==="true"); save(); render(false); maybeAutoAdvance(); return; }
      if(action==="check"){ setPath(state, el.getAttribute("data-path"), el.checked); save(); render(false); return; }
      if(action==="togglearr"){
        var path = el.getAttribute("data-path"), val = el.getAttribute("data-value");
        var arr = getPath(state,path);
        var idx = arr.indexOf(val);
        if(idx>-1) arr.splice(idx,1); else arr.push(val);
        save(); render(false); return;
      }
      if(action==="rankup" || action==="rankdown"){
        var ok = el.getAttribute("data-orderkey"), i0 = parseInt(el.getAttribute("data-idx"),10);
        var arr2 = state[ok];
        var j = action==="rankup" ? i0-1 : i0+1;
        if(j>=0 && j<arr2.length){ var tmp=arr2[i0]; arr2[i0]=arr2[j]; arr2[j]=tmp; }
        save(); render(false); return;
      }
      if(action==="quizAnswer"){
        var qk = el.getAttribute("data-key");
        var picked = parseInt(el.getAttribute("data-value"),10);
        var inst = state.instruments[qk];
        inst.quizSelected = picked;
        inst.connait = (picked === QUIZ_BANK[qk][inst.quizIdx].correct);
        save(); render(false); return;
      }
      if(action==="quizIdk"){
        var ik = state.instruments[el.getAttribute("data-key")];
        ik.quizSelected = -1;
        ik.connait = false;
        save(); render(false); return;
      }
      if(action==="copy"){
        var txt = buildSyntheseText();
        copyText(txt);
        return;
      }
      if(action==="download"){
        downloadSynthese();
        return;
      }
      if(action==="downloadPdf"){
        if(el.disabled) return;
        downloadFilledPdf(el);
        return;
      }
      if(action==="submitToAdvisor"){
        if(el.disabled) return;
        submitToAdvisorFlow(el);
        return;
      }
    });
  });

  app.querySelectorAll(".rankhandle").forEach(setupDragHandle);
}

function setupDragHandle(handle){
  handle.addEventListener("pointerdown", function(e){
    e.preventDefault();
    var item = handle.closest(".rankitem");
    var list = item.parentElement;
    var items = Array.from(list.children);
    var orderKey = handle.getAttribute("data-orderkey");
    var startIdx = parseInt(handle.getAttribute("data-idx"),10);
    var startY = e.clientY;
    var rowH = item.getBoundingClientRect().height + 8;
    var currentIdx = startIdx;

    item.classList.add("dragging");
    items.forEach(function(other){ if(other!==item) other.classList.add("rank-shifting"); });
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}

    function onMove(e){
      var deltaY = e.clientY - startY;
      item.style.transform = "translateY("+deltaY+"px)";
      var shift = Math.round(deltaY / rowH);
      var newIdx = Math.max(0, Math.min(items.length-1, startIdx+shift));
      if(newIdx !== currentIdx){
        items.forEach(function(other, i){
          if(other===item) return;
          if(i>startIdx && i<=newIdx) other.style.transform = "translateY(-"+rowH+"px)";
          else if(i<startIdx && i>=newIdx) other.style.transform = "translateY("+rowH+"px)";
          else other.style.transform = "";
        });
        currentIdx = newIdx;
      }
    }
    function onUp(e){
      try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
      handle.removeEventListener("pointermove", onMove);
      handle.removeEventListener("pointerup", onUp);
      handle.removeEventListener("pointercancel", onUp);
      if(currentIdx !== startIdx){
        var arr = state[orderKey];
        var moved = arr.splice(startIdx,1)[0];
        arr.splice(currentIdx,0,moved);
        save();
      }
      render(false);
    }
    handle.addEventListener("pointermove", onMove);
    handle.addEventListener("pointerup", onUp);
    handle.addEventListener("pointercancel", onUp);
  });
}

function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ showToast("Synthèse copiée ✓"); })
      .catch(function(){ fallbackCopy(txt); });
  } else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  try{
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    showToast("Synthèse copiée ✓");
  }catch(e){ showToast("Impossible de copier automatiquement"); }
}

function downloadSynthese(){
  var txt = buildSyntheseText();
  triggerDownload(new Blob([txt], {type:"text/plain;charset=utf-8"}), "synthese-connaissance-client.txt");
  showToast("Fichier téléchargé ✓");
}

function triggerDownload(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

function downloadFilledPdf(btn){
  var originalLabel = btn.textContent;
  btn.disabled = true; btn.textContent = "Génération du PDF…";
  IvoPdfFill.fillAnnexe4(state).then(function(bytes){
    var clientLabel = state.personType==="morale" ? state.morale.denomination : (state.nom||"client");
    var filename = "IVO-connaissance-client-" + (clientLabel||"client").replace(/[^a-zA-Z0-9-]+/g,"_") + ".pdf";
    triggerDownload(new Blob([bytes], {type:"application/pdf"}), filename);
    state.pdfDownloaded = true;
    save();
    showToast("PDF téléchargé ✓ — vous pouvez maintenant l'envoyer");
    render(false);
  }).catch(function(err){
    console.error(err);
    btn.disabled = false; btn.textContent = originalLabel;
    showToast("Erreur lors de la génération du PDF");
  });
}

/* ⚠ LIÉ À lib/pdf-fill.js (fillAnnexe4) ET lib/submit.js (submitToAdvisor) —
   les deux attendent l'objet "state" complet tel que défaultState()/l'étape
   du questionnaire le construit ; voir la note "TRÈS LIÉ AU RESTE DU PROJET"
   sur defaultState() plus haut dans ce fichier. */
function submitToAdvisorFlow(btn){
  var originalLabel = btn.textContent;
  var errBox = document.getElementById("sendError");
  if(errBox) errBox.innerHTML = "";
  btn.disabled = true; btn.textContent = "Envoi en cours…";
  IvoPdfFill.fillAnnexe4(state).then(function(bytes){
    return IvoSubmit.submitToAdvisor(state, bytes);
  }).then(function(){
    state.sentAt = Date.now();
    save();
    showToast("Envoyé à votre conseiller ✓");
    render(false);
  }).catch(function(err){
    console.error(err);
    btn.disabled = false; btn.textContent = originalLabel;
    if(errBox){
      errBox.innerHTML = '<div class="finalbox-hint">'+esc(err.message||"Une erreur est survenue.")+
        ' — vous pouvez réessayer, ou <a href="#" id="fallbackDownload">télécharger le PDF</a> pour l\'envoyer vous-même en pièce jointe.</div>';
      var fb = document.getElementById("fallbackDownload");
      if(fb) fb.addEventListener("click", function(e){ e.preventDefault(); downloadFilledPdf(fb); });
    }
  });
}

/* --- DÉMARRAGE / FILET DE SÉCURITÉ ---
   Si l'affichage échoue malgré tout à cause du brouillon enregistré, on ne
   laisse pas le client devant une page blanche : le brouillon fautif est mis
   de côté (clé STORAGE_KEY + "_backup", récupérable depuis la console) et le
   questionnaire repart de l'accueil. */
try{
  render();
}catch(startErr){
  console.error("Brouillon illisible, questionnaire réinitialisé :", startErr);
  try{
    var rawDraft = localStorage.getItem(STORAGE_KEY);
    if(rawDraft) localStorage.setItem(STORAGE_KEY + "_backup", rawDraft);
    localStorage.removeItem(STORAGE_KEY);
  }catch(e){}
  state = defaultState();
  visited = {};
  render();
}
})();
</script>
